name: mgs_app2
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: '>=3.3.3 <4.0.0'

dependencies:
  flutter_localizations:
    sdk: flutter

  dotted_border: ^2.1.0
  flutter:
    sdk: flutter
  intl: ^0.19.0
  provider: ^6.1.2
  firebase_core: ^3.5.0
  firebase_storage: ^12.3.1
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.2
  cloud_functions: ^5.1.2
  line_icons: ^2.0.3
  image_picker: ^1.0.4
  image_cropper: ^8.0.2
  mime: ^1.0.5
  url_launcher: ^6.3.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - resources/languages/it.json
    - resources/languages/errors/it.json
    - resources/languages/en.json
    - resources/languages/errors/en.json
    - resources/profile_pic.jpeg
  
  fonts:
   - family: Montserrat
     fonts: 
       - asset: assets/fonts/Montserrat-Light.ttf
